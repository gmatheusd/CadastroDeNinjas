<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <style>
        /* Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#f4f7fc;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .card{
            width:100%;
            max-width:750px;
            background:#fff;
            border-radius:18px;
            padding:35px;
            box-shadow:0 15px 40px rgba(0,0,0,.08);
        }

        h1{
            text-align:center;
            color:#3b82f6;
            margin-bottom:30px;
        }

        .mensagem{
            text-align:center;
            background:#fee2e2;
            color:#991b1b;
            border-radius:10px;
            padding:12px 16px;
            font-size:14px;
            margin-bottom:20px;
        }

        .header{
            display:flex;
            align-items:center;
            gap:25px;
            margin-bottom:30px;
        }

        .info{
            flex:1;
        }

        .info h2{
            color:#1f2937;
            margin-bottom:15px;
            font-size:2rem;
        }

        .info p{
            margin-bottom:10px;
            color:#555;
            font-size:15px;
        }

        .info strong{
            color:#111827;
        }

        h3{
            margin-bottom:15px;
            color:#1f2937;
        }

        table{
            width:100%;
            border-collapse:collapse;
            overflow:hidden;
            border-radius:12px;
        }

        thead{
            background:linear-gradient(90deg,#2563eb,#3b82f6);
            color:#fff;
        }

        thead th{
            padding:15px;
            text-align:left;
        }

        tbody td{
            padding:15px;
            border-bottom:1px solid #ececec;
        }

        tbody tr:hover{
            background:#f8fbff;
        }

        tbody tr:last-child td{
            border-bottom:none;
        }

        tbody img{
            width:45px;
            height:45px;
            object-fit:cover;
            border-radius:50%;
            border:3px solid #3b82f6;
        }

        .actions{
            margin-top:30px;
            display:flex;
            justify-content:center;
        }

        .btn{
            text-decoration:none;
            background:#2563eb;
            color:#fff;
            padding:12px 24px;
            border-radius:10px;
            font-weight:600;
            transition:.3s;
        }

        .btn:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }

        @media(max-width:768px){

            .card{
                padding:25px;
            }

            .header{
                flex-direction:column;
                text-align:center;
            }

            .info h2{
                font-size:1.7rem;
            }

            table{
                display:block;
                overflow-x:auto;
            }

        }
    </style>
    <title>Detalhes da Missão</title>
</head>
<body>
<div class="card">

    <h1>Detalhes da Missão</h1>
    <p class="mensagem" th:if="${mensagem}" th:text="${mensagem}"></p>
    <div class="header">

        <div class="info">
            <h2 th:text="${missao.nome}"></h2>

            <p><strong>Dificuldade:</strong>
                <span th:text="${missao.dificuldade}"></span>
            </p>


        </div>

    </div>

    <h3>Missões</h3>

    <table>
        <thead>
        <tr>
            <th>Imagem</th>
            <th>Nome</th>
            <th>Idade</th>
            <th>Email</th>
            <th>Rank</th>
        </tr>
        </thead>
        
        <tbody>
        <tr th:if="${missao.ninjas == null or missao.ninjas.isEmpty()}">
            <td colspan="5">Nenhum ninja foi cadastrado nessa missão.</td>
        </tr>

        <tr th:each="ninja : ${missao.ninjas}">
            <td><img th:src="${ninja.imgUrl}" th:alt="${ninja.nome}"></td>
            <td th:text="${ninja.nome}"></td>
            <td th:text="${ninja.idade}"></td>
            <td th:text="${ninja.email}"></td>
            <td th:text="${ninja.rank}"></td>
        </tr>
        </tbody>
    </table>

    <div class="actions">
        <a th:href="@{/missoes/ui/listar}" class="btn">
            ← Voltar para a lista
        </a>
    </div>

</div>
</body>
</html>
