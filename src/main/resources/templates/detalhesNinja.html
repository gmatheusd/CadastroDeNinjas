<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <style>
        /* Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#f4f7fc;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .card{
            width:100%;
            max-width:750px;
            background:#fff;
            border-radius:18px;
            padding:35px;
            box-shadow:0 15px 40px rgba(0,0,0,.08);
        }

        h1{
            text-align:center;
            /*color:#1f2937;*/
            color: #3b82f6;
            margin-bottom:30px;
        }

        .header{
            display:flex;
            align-items:center;
            gap:25px;
            margin-bottom:30px;
        }

        .header img{
            width:170px;
            height:170px;
            object-fit:cover;
            border-radius:50%;
            border:5px solid #3b82f6;
        }

        .info{
            flex:1;
        }

        .info h2{
            color:#1f2937;
            margin-bottom:15px;
            font-size:2rem;
        }

        .info p{
            margin-bottom:10px;
            color:#555;
            font-size:15px;
        }

        .info strong{
            color:#111827;
        }

        h3{
            margin-bottom:15px;
            color:#1f2937;
        }

        table{
            width:100%;
            border-collapse:collapse;
            overflow:hidden;
            border-radius:12px;
        }

        thead{
            background:linear-gradient(90deg,#2563eb,#3b82f6);
            color:#fff;
        }

        thead th{
            padding:15px;
            text-align:left;
        }

        tbody td{
            padding:15px;
            border-bottom:1px solid #ececec;
        }

        tbody tr:hover{
            background:#f8fbff;
        }

        tbody tr:last-child td{
            border-bottom:none;
        }

        .actions{
            margin-top:30px;
            display:flex;
            justify-content:center;
        }

        .btn{
            text-decoration:none;
            background:#2563eb;
            color:#fff;
            padding:12px 24px;
            border-radius:10px;
            font-weight:600;
            transition:.3s;
        }

        .btn:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }

        @media(max-width:768px){

            .card{
                padding:25px;
            }

            .header{
                flex-direction:column;
                text-align:center;
            }

            .header img{
                width:150px;
                height:150px;
            }

            .info h2{
                font-size:1.7rem;
            }

            table{
                display:block;
                overflow-x:auto;
            }

        }
    </style>
    <title>Detalhes Ninja</title>
</head>
<body>

<div class="card">

    <h1>Detalhes do Ninja</h1>

    <div class="header">

        <img th:src="${ninja.imgUrl}"
             th:alt="${ninja.nome}">

        <div class="info">
            <h2 th:text="${ninja.nome}"></h2>

            <p><strong>Email:</strong>
                <span th:text="${ninja.email}"></span>
            </p>

            <p><strong>Idade:</strong>
                <span th:text="${ninja.idade}"></span>
            </p>

            <p><strong>Rank:</strong>
                <span th:text="${ninja.rank}"></span>
            </p>
        </div>

    </div>

    <h3>Missões</h3>

    <table>
        <thead>
        <tr>
            <th>Nome</th>
            <th>Dificuldade</th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${ninja.missao != null}">
            <td th:text="${ninja.missao.nome}"></td>
            <td th:text="${ninja.missao.dificuldade}"></td>
        </tr>

        <tr th:if="${ninja.missao == null}">
            <td colspan="2">Sem missão cadastrada.</td>
        </tr>
        </tbody>
    </table>

    <div class="actions">
        <a th:href="@{/ninjas/ui/listar}" class="btn">
            ← Voltar para a lista
        </a>
    </div>

</div>

</body>
</html>
