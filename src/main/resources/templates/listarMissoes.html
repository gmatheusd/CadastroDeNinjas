<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <style>
        /* Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#f4f7fc;
            padding:40px;
            color:#333;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#1f2937;
            font-size:2rem;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:#fff;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        thead{
            background:linear-gradient(90deg,#2563eb,#3b82f6);
            color:white;
        }

        thead th{
            padding:18px;
            text-align:left;
            font-weight:600;
        }

        th:first-child, td:first-child{
            width:80px;
            text-align:center;
        }

        th:nth-child(3), td:nth-child(3){
            width:160px;
            text-align:center;
        }

        th:last-child, td:last-child{
            width:1%;
            white-space:nowrap;
        }

        tbody td{
            padding:16px;
            border-bottom:1px solid #ececec;
        }

        .badge{
            display:inline-block;
            padding:5px 14px;
            border-radius:999px;
            font-size:13px;
            font-weight:600;
            text-transform:capitalize;
        }

        .badge-facil{
            background:#dcfce7;
            color:#166534;
        }

        .badge-media{
            background:#fef3c7;
            color:#92400e;
        }

        .badge-dificil{
            background:#fee2e2;
            color:#991b1b;
        }

        tbody tr{
            transition:.3s;
        }

        tbody tr:hover{
            background:#f8fbff;
        }

        tbody tr:last-child td{
            border-bottom:none;
        }

        img{
            width:55px;
            height:55px;
            object-fit:cover;
            border-radius:50%;
            border:3px solid #3b82f6;
        }

        /* Mission text */
        td span{
            font-size:14px;
        }

        /* Action buttons */
        .actions{
            display:flex;
            align-items:center;
            gap:10px;
        }

        .actions a{
            text-decoration:none;
            padding:8px 15px;
            border-radius:8px;
            color:white;
            font-size:14px;
            font-weight:500;
            transition:.3s;
        }

        .btn-add {
            background: #3cbd6a;
            margin: 10px;
        }

        .btn-add:hover {
            background: #287e46;
        }

        .btn-view{
            background:#3b82f6;
        }

        .btn-view:hover{
            background:#2563eb;
        }

        .btn-edit{
            background:#f59e0b;
        }

        .btn-edit:hover{
            background:#d97706;
        }

        .btn-delete{
            background:#ef4444;
        }

        .btn-delete:hover{
            background:#dc2626;
        }

        .btn-nav{
            background:#6366f1;
            margin: 10px;
        }

        .btn-nav:hover{
            background:#4f46e5;
        }

        /* Responsive */
        @media(max-width:900px){

            body{
                padding:15px;
            }

            table{
                display:block;
                overflow-x:auto;
                white-space:nowrap;
            }

        }
    </style>
    <title>Tabela de Missões</title>
</head>
<body>
<h1>Lista de Missões</h1>
<div class="actions">
    <a th:href="@{/missoes/ui/adicionar}" class="btn-add">+ Adicionar Missão</a>
    <a th:href="@{/ninjas/ui/listar}" class="btn-nav">Ver Ninjas</a>
</div>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Dificuldade</th>
        <th>Opções</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each ="missao: ${missoes}">

        <td th:text="${missao.id}"></td>
        <td th:text="${missao.nome}"></td>
        <td>
            <span class="badge"
                  th:text="${missao.dificuldade}"
                  th:classappend="${#strings.toLowerCase(missao.dificuldade) == 'facil'} ? 'badge-facil' : (${#strings.toLowerCase(missao.dificuldade) == 'media'} ? 'badge-media' : 'badge-dificil')">
            </span>
        </td>

        <td>
            <div class="actions">
                <a class="btn-view" th:href="@{/missoes/ui/listar/{id}(id=${missao.id})}">
                    Ver detalhes
                </a>

                <a class="btn-edit" th:href="@{/missoes/ui/alterar/{id}(id=${missao.id})}">
                    Alterar
                </a>

                <a class="btn-delete" th:href="@{/missoes/ui/deletar/{id}(id=${missao.id})}">
                    Deletar
                </a>
            </div>
        </td>


    </tr>
    </tbody>
</table>
</body>
</html>
