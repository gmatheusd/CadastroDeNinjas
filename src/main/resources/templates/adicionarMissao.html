<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Adicionar Missão</title>
    <style>
        /* Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#f4f7fc;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px;
        }

        .container{
            width:100%;
            max-width:650px;
        }

        .container h1{
            text-align:center;
            margin-bottom:30px;
            color:#1f2937;
        }

        .form-container{
            width:100%;
            max-width:650px;
            background:#fff;
            padding:30px;
            border-radius:18px;
            box-shadow:0 15px 40px rgba(0,0,0,.08);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#1f2937;
        }

        form{
            display:flex;
            flex-direction:column;
        }

        label{
            margin-top:14px;
            margin-bottom:5px;
            font-weight:600;
            color:#374151;
        }

        input, select{
            width:100%;
            padding:7px 10px;
            border:1px solid #d1d5db;
            border-radius:10px;
            font-size:15px;
            transition:.3s;
            outline:none;
        }

        input:focus, select:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 4px rgba(37,99,235,.15);
        }

        button{
            margin-top:25px;
            padding:10px;
            border:none;
            border-radius:10px;
            background:linear-gradient(90deg,#2563eb,#3b82f6);
            color:#fff;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:.3s ease-in-out;
        }

        button:hover{
            transform:translateY(-1px);
            box-shadow:0 10px 20px rgba(37,99,235,.25);
        }

        button:active{
            transform:translateY(0);
        }

        .mensagem{
            background:#dcfce7;
            color:#166534;
            border:1px solid #86efac;
            padding:14px;
            border-radius:10px;
            margin-bottom:20px;
            text-align:center;
            font-weight:500;
        }

        .back-link{
            display:block;
            margin-top:20px;
            text-align:center;
            text-decoration:none;
            color:#2563eb;
            font-weight:600;
            transition:.3s;
        }

        .back-link:hover{
            color:#1d4ed8;
        }

        @media(max-width:768px){

            body{
                padding:20px;
            }

            .form-container{
                padding:25px;
            }

        }
    </style>
</head>
<body>
<div class="container">
    <h1>Adicionar Nova Missão</h1>
    <div class="form-container">
        <div th:if="${mensagem}" class="mensagem" th:text="${mensagem}"></div>
        <form th:action="@{/missoes/ui/salvar}" th:object="${missao}" method="post">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" required>

            <label for="dificuldade">Dificuldade:</label>
            <input type="text" id="dificuldade" th:field="*{dificuldade}" required>

            <button type="submit">Cadastrar Missão</button>
        </form>
        <a th:href="@{/missoes/ui/listar}" class="back-link">
            ← Voltar para a lista de missões
        </a>
    </div>
</div>
</body>
</html>
